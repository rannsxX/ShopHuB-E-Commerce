name: Generate GitHub Snake

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 0 * * *"

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rannsxX
          outputs: |
            dist/snake.svg?palette=github-dark

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake-output
          build_dir: dist
          commit_message: "Update Snake animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}